<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTConnect CNC Digital Twin</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #d9dee4; color: #1d232b; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 350px; max-height: calc(100vh - 24px); overflow: auto;
    background: rgba(255,255,255,0.94); border: 1px solid #c3cad3; border-radius: 10px; padding: 14px; font-size: 13px;
    box-shadow: 0 6px 24px rgba(30,40,60,0.15);
  }
  #panel h1 { font-size: 16px; margin: 0 0 2px; }
  #panel h2 { font-size: 11px; margin: 14px 0 5px; color: #5b6878; text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: #5b6878; font-size: 12px; margin-bottom: 8px; }
  label { display: block; margin: 6px 0 2px; color: #5b6878; font-size: 12px; }
  input, select, button { width: 100%; padding: 6px 8px; background: #fff; color: #1d232b; border: 1px solid #b9c2cd; border-radius: 6px; font: inherit; }
  button { cursor: pointer; background: #f1f3f6; }
  button:hover { background: #e6eaef; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row button { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 5px 2px; border-bottom: 1px solid #e3e7ec; vertical-align: top; }
  .val { text-align: right; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  .muted { color: #6b7786; font-size: 11px; line-height: 1.35; }
  .bar { height: 4px; background: #e3e7ec; border-radius: 2px; margin-top: 4px; position: relative; }
  .bar i { position: absolute; top: -2px; width: 3px; height: 8px; border-radius: 1px; background: #1d232b; }
  #status { margin-top: 8px; font-size: 12px; }
  .ok { color: #1a7f37; } .err { color: #c62828; } .warn { color: #b26a00; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .kv span:nth-child(odd) { color: #6b7786; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>CNC Digital Twin</h1>
  <div class="sub">Built from the MTConnect probe, driven by live observations</div>
  <label>Agent URL</label>
  <input id="agentUrl">
  <label>Device</label>
  <select id="deviceSel"></select>
  <div class="row">
    <button id="connectBtn">Reconnect</button>
    <button id="trailBtn">Tool path: on</button>
    <button id="viewBtn">Reset view</button>
  </div>
  <div id="status" class="muted">Not connected</div>

  <h2>Machine (from probe)</h2>
  <div id="deviceInfo" class="kv"></div>

  <h2>Safety check</h2>
  <div id="safety" class="kv"></div>

  <h2>Axes</h2>
  <table id="axisTable"><tbody></tbody></table>

  <h2>Coordinate systems</h2>
  <div id="coordInfo" class="muted">-</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   1. CONFIG  (nothing here names a device, a data item or an axis set)
   ===================================================================== */
const params = new URLSearchParams(location.search);
const DEFAULT_AGENT = params.get('agent') || (location.port ? `${location.origin}/agent` : 'https://demo.metalogi.io');
const POLL_MS = Number(params.get('poll') || 400);
const PLAYBACK_DELAY = POLL_MS + 450;       // ms behind live, so we can interpolate between real samples
const SPIN_SCALE = 0.02;                    // spindles are drawn slowed down so rotation is visible
const $ = id => document.getElementById(id);
$('agentUrl').value = DEFAULT_AGENT;
const V3 = THREE.Vector3;

/* =====================================================================
   2. MTCONNECT HELPERS
   ===================================================================== */
async function fetchXml(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  const doc = new DOMParser().parseFromString(await res.text(), 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Bad XML from ' + url);
  return doc;
}
const byTag = (node, tag) => Array.from(node.getElementsByTagNameNS('*', tag));
const kids = (node, tag) => Array.from(node.children).filter(c => !tag || c.localName === tag);
const vec3 = text => { const v = (text || '').trim().split(/\s+/).map(Number); return v.length === 3 && !v.some(isNaN) ? v : null; };
const num = text => { const n = parseFloat(text); return isFinite(n) ? n : null; };
function ownDataItems(comp) { const di = kids(comp, 'DataItems')[0]; return di ? kids(di, 'DataItem') : []; }

/* =====================================================================
   3. DISCOVERY: probe -> axes, units, coordinate systems, kinematics, limits
   ===================================================================== */
// Only used when the probe gives no <Motion><Axis> vector (ISO 841 letters).
const NAME_VEC = { X: [1,0,0], U: [1,0,0], Y: [0,1,0], V: [0,1,0], Z: [0,0,1], W: [0,0,1], A: [1,0,0], B: [0,1,0], C: [0,0,1] };

function coordSystems(deviceEl) {
  const map = {};
  for (const cs of byTag(deviceEl, 'CoordinateSystem')) {
    map[cs.getAttribute('id')] = { id: cs.getAttribute('id'), type: cs.getAttribute('type') || '',
      parent: cs.getAttribute('parentIdRef'), t: vec3(byTag(cs, 'Translation')[0]?.textContent) || [0,0,0] };
  }
  return map;
}
// Translation of a coordinate system relative to the base, following parentIdRef
function csOffset(cs, id) { const t = [0,0,0]; let n = 0; while (id && cs[id] && n++ < 10) { cs[id].t.forEach((v, i) => t[i] += v); id = cs[id].parent; } return t; }

function discover(deviceEl) {
  const cs = coordSystems(deviceEl);
  const csTypeOf = d => d.getAttribute('coordinateSystem') || cs[d.getAttribute('coordinateSystemIdRef')]?.type || '';
  const pick = (items, type) => {
    const c = items.filter(d => d.getAttribute('type') === type && d.getAttribute('category') !== 'CONDITION');
    const score = d => { const sub = d.getAttribute('subType'), t = csTypeOf(d);
      return (sub === 'ACTUAL' ? 4 : !sub ? 2 : sub === 'COMMANDED' ? 1 : 0) + (t === 'MACHINE' ? 2 : !t ? 1 : 0); };
    return c.sort((a, b) => score(b) - score(a))[0] || null;
  };

  const axes = [];
  for (const comp of byTag(deviceEl, '*')) {
    const tag = comp.localName;
    if (tag !== 'Linear' && tag !== 'Rotary') continue;
    const kind = tag === 'Linear' ? 'linear' : 'rotary';
    const items = ownDataItems(comp);
    const name = comp.getAttribute('name') || comp.getAttribute('nativeName') || comp.getAttribute('id');
    const pos = pick(items, kind === 'linear' ? 'POSITION' : 'ANGLE');
    const vel = pick(items, 'ROTARY_VELOCITY');
    const role = kind === 'linear' ? 'linear' : (pos ? 'rotary' : 'spindle');
    const item = pos || (role === 'spindle' ? vel : null);
    if (!item) continue;

    const motion = byTag(comp, 'Motion')[0];
    const rels = byTag(comp, 'ComponentRelationship');
    const rel = t => rels.find(r => r.getAttribute('type') === t)?.getAttribute('idRef') || null;
    let vec = vec3(motion && kids(motion, 'Axis')[0]?.textContent), vecSource = 'probe vector';
    if (!vec || !vec.some(v => v)) {
      const L = name?.[0]?.toUpperCase();
      vec = (L && (kind === 'linear' ? 'XYZUVW' : 'ABC').includes(L)) ? NAME_VEC[L] : null;
      vecSource = vec ? 'axis letter' : 'auto';
    }
    const csRef = item.getAttribute('coordinateSystemIdRef') || motion?.getAttribute('coordinateSystemIdRef') || null;
    const csMove = motion?.getAttribute('coordinateSystemIdRef') || csRef;
    const spec = t => byTag(comp, 'Specification').find(s => s.getAttribute('type') === t);
    const sv = (s, tag) => s ? num(kids(s, tag)[0]?.textContent) : null;
    const cons = kids(item, 'Constraints')[0];
    const cMin = sv(cons, 'Minimum'), cMax = sv(cons, 'Maximum');
    const sLen = spec('LENGTH'), sAng = spec('ANGLE');

    axes.push({
      id: comp.getAttribute('id'), name, kind, role, vec, vecSource,
      itemId: item.getAttribute('id'),
      itemType: item.getAttribute('type') + (item.getAttribute('subType') ? '/' + item.getAttribute('subType') : ''),
      units: item.getAttribute('units') || '',
      csName: csRef || item.getAttribute('coordinateSystem') || '', csType: csTypeOf(item),
      csT: csMove ? csOffset(cs, csMove) : [0,0,0],
      motionId: motion?.getAttribute('id') || null, motionParent: motion?.getAttribute('parentIdRef') || null,
      motionType: motion?.getAttribute('type') || '',
      relParent: rel('PARENT'), relChild: rel('CHILD'),
      limits: (cMin !== null && cMax !== null && cMax > cMin) ? { min: cMin, max: cMax } : null,   // on the data item
      specLen: sv(sLen, 'Nominal') ?? ((sv(sLen, 'Maximum') !== null && sv(sLen, 'Minimum') !== null) ? sv(sLen, 'Maximum') - sv(sLen, 'Minimum') : null),
      specAng: (sv(sAng, 'Minimum') !== null && sv(sAng, 'Maximum') !== null) ? { min: sv(sAng, 'Minimum'), max: sv(sAng, 'Maximum') } : null,
      samples: [], obsMin: Infinity, obsMax: -Infinity, cur: null, raw: undefined, spin: 0,
    });
  }

  // Axes with no usable direction get the first unused one, so unknown names still work
  for (const kind of ['linear', 'rotary']) {
    const group = axes.filter(a => a.kind === kind);
    const used = new Set(group.filter(a => a.vec).map(a => a.vec.map(Math.abs).indexOf(Math.max(...a.vec.map(Math.abs)))));
    for (const a of group.filter(a => !a.vec)) {
      if (a.role === 'spindle') { a.vec = [0,0,1]; continue; }
      const i = [0,1,2].find(i => !used.has(i)) ?? 0; used.add(i);
      a.vec = [0,0,0]; a.vec[i] = 1;
    }
  }
  for (const a of axes) {
    const len = Math.hypot(...a.vec);
    a.k = a.vec.map(Math.abs).indexOf(Math.max(...a.vec.map(Math.abs)));   // dominant machine axis 0/1/2
    a.gain = a.kind === 'linear' ? len : 1;       // e.g. 0.5 for a lathe X axis that reports diameter
    a.u = a.vec.map(v => v / len);                // signed unit vector, machine coordinates
    a.offset = a.kind === 'linear' ? a.csT[a.k] : 0;   // where this coordinate system sits relative to the base
    a.letter = 'XYZ'[a.k];
  }

  // Kinematic parents: Motion parentIdRef, else ComponentRelationship PARENT (-> another axis's CHILD id or id)
  const byMotion = {}, byChild = {}, byId = {};
  for (const a of axes) { if (a.motionId) byMotion[a.motionId] = a; if (a.relChild) byChild[a.relChild] = a; byId[a.id] = a; }
  for (const a of axes) {
    a.parentAxis = (a.motionParent && byMotion[a.motionParent]) || (a.relParent && (byChild[a.relParent] || byId[a.relParent])) || null;
    if (a.parentAxis === a) a.parentAxis = null;
    a.kinDeclared = !!(a.motionParent || a.relParent || a.motionId);
  }
  return axes;
}

/* Which axes carry the TOOL and which carry the WORKPIECE?
   Axes linked by their declared parents form chains. The chain with the most linear axes is the
   tool side (ties: has a Z-type axis, then has a spindle); the other chains hold the work.
   If the probe declares no parents at all, fall back to the classic vertical mill: X/Y and
   rotaries under the table, Z and the spindle on the head. */
function assignSides(axes) {
  const root = a => { let r = a, n = 0; while (r.parentAxis && n++ < 20) r = r.parentAxis; return r; };
  const depth = a => { let d = 0, p = a.parentAxis; while (p && d < 20) { d++; p = p.parentAxis; } return d; };
  axes.forEach(a => a.depth = depth(a));
  const kinematic = axes.some(a => a.parentAxis);
  const trees = new Map();
  if (kinematic) {
    for (const a of axes.filter(a => a.kinDeclared)) { const r = root(a); if (!trees.has(r)) trees.set(r, []); trees.get(r).push(a); }
    const score = l => [l.filter(a => a.role === 'linear').length, l.some(a => a.role === 'linear' && a.k === 2) ? 1 : 0, l.some(a => a.role === 'spindle') ? 1 : 0];
    let toolTree = null, best = null;
    for (const l of trees.values()) {
      const s = score(l);
      if (!best || s[0] > best[0] || (s[0] === best[0] && (s[1] > best[1] || (s[1] === best[1] && s[2] > best[2])))) { best = s; toolTree = l; }
    }
    for (const a of axes) {
      if (a.kinDeclared) a.side = toolTree.includes(a) ? 'tool' : 'part';
      else if (a.role === 'spindle') a.side = toolTree.some(b => b.role === 'spindle') ? 'part' : 'tool';
      else a.side = (a.role === 'linear' && a.k === 2) ? 'tool' : 'part';
    }
  } else {
    for (const a of axes) a.side = (a.role === 'spindle' || (a.role === 'linear' && a.k === 2)) ? 'tool' : 'part';
  }
  // A machine whose WORK is held in a spindle is a turning machine (lathe / mill-turn)
  const turning = axes.some(a => a.side === 'part' && a.role === 'spindle');
  const ord = a => (a.role === 'linear' ? 0 : a.role === 'rotary' ? 1 : 2);
  const sortChain = l => l.slice().sort((p, q) => ord(p) - ord(q) || p.depth - q.depth || (p.role === 'linear' ? [1,0,2][p.k] - [1,0,2][q.k] : (p.k === 2) - (q.k === 2)));
  const tool = sortChain(axes.filter(a => a.side === 'tool'));
  // Part side: one group per kinematic tree (e.g. main spindle / sub-spindle on its own slide)
  let partGroups = [];
  const partAxes = axes.filter(a => a.side === 'part');
  if (kinematic) {
    const m = new Map();
    for (const a of partAxes) { const r = a.kinDeclared ? root(a) : null; if (!m.has(r)) m.set(r, []); m.get(r).push(a); }
    partGroups = [...m.values()].map(sortChain);
  } else if (partAxes.length) partGroups = [sortChain(partAxes)];
  return { mode: kinematic ? 'probe kinematics' : 'layout convention', turning, tool, partGroups };
}

/* =====================================================================
   4. SCENE
   ===================================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9dee4);
scene.fog = new THREE.Fog(0xd9dee4, 9000, 22000);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 10, 40000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
$('view').appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.495;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8894a3, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 2;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.6); fill.position.set(-2000, 1500, -1500); scene.add(fill);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), new THREE.MeshStandardMaterial({ color: 0xcfd5dc, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(12000, 60, 0xaab3bf, 0xbcc4ce); grid.position.y = 0.5; scene.add(grid);

const mk = (color, metalness, roughness) => new THREE.MeshStandardMaterial({ color, metalness, roughness });
const M = {
  cast: mk(0x56616f, 0.25, 0.7),      // frame castings
  castDark: mk(0x3c4550, 0.25, 0.75),
  slide: mk(0xdfe3e8, 0.15, 0.55),    // moving carriages / tables
  steel: mk(0xaeb7c2, 0.85, 0.3),     // rails, screws, chucks
  dark: mk(0x23282f, 0.4, 0.6),       // motors, slots
  tool: mk(0xe9c46a, 0.7, 0.35),
  stock: mk(0xc9ced6, 0.9, 0.25),
  rot: mk(0x8e7cc3, 0.25, 0.55),      // rotary-axis bodies
};
const AXIS_HEX = [0xd64545, 0x2e9e4f, 0x2f6fd6];            // machine X / Y / Z
const accent = k => mk(AXIS_HEX[k], 0.2, 0.5);
const edgeMat = new THREE.LineBasicMaterial({ color: 0x1d232b, transparent: true, opacity: 0.28 });

function solid(geo, mat, edges = true) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true;
  if (edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat));
  return m;
}
const box = (x, y, z, mat) => solid(new THREE.BoxGeometry(x, y, z), mat);
// Cylinder whose axis lies along scene axis idx (0 x, 1 y, 2 z)
function cyl(idx, rTop, rBot, len, mat, seg = 36) {
  const m = solid(new THREE.CylinderGeometry(rTop, rBot, len, seg), mat);
  if (idx === 0) m.rotation.z = -Math.PI / 2; else if (idx === 2) m.rotation.x = Math.PI / 2;
  return m;
}
// Box given by its size along axis idx and along the two other axes (in x,y,z order)
function boxAlong(idx, along, o1, o2, mat) { const d = [0,0,0]; d[idx] = along; const o = [0,1,2].filter(i => i !== idx); d[o[0]] = o1; d[o[1]] = o2; return box(d[0], d[1], d[2], mat); }
const unit = i => new V3(i === 0 ? 1 : 0, i === 1 ? 1 : 0, i === 2 ? 1 : 0);
const dom = v => { const a = [Math.abs(v.x), Math.abs(v.y), Math.abs(v.z)]; return a.indexOf(Math.max(...a)); };
function label(text, hex) {
  const c = document.createElement('canvas'); c.width = 160; c.height = 80; const g = c.getContext('2d');
  g.fillStyle = '#' + hex.toString(16).padStart(6, '0'); g.beginPath(); g.roundRect(4, 4, 152, 72, 16); g.fill();
  g.fillStyle = '#fff'; g.font = 'bold 46px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 80, 43);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  s.scale.set(110, 55, 1); s.renderOrder = 10; return s;
}
function meshesOf(root) { const out = []; root.traverse(o => { if (o.isMesh) out.push(o); }); return out; }
function boxOf(objs, filter) {
  const b = new THREE.Box3(), t = new THREE.Box3();
  for (const root of [].concat(objs)) root.traverse(o => { if (o.isMesh && (!filter || filter(o))) { o.geometry.boundingBox || o.geometry.computeBoundingBox(); t.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld); b.union(t); } });
  return b;
}

/* =====================================================================
   5. KINEMATICS: values -> joint displacement -> transform
   ===================================================================== */
const MM = { MILLIMETER: 1, INCH: 25.4, METER: 1000, CENTIMETER: 10, FOOT: 304.8 };
// Raw observation -> joint value q.  Linear: true mm of travel from the base origin, using the probe's
// units, the axis vector length (diameter axes report 2x) and the coordinate system translation.
// Rotary: degrees.  Spindle: rev/min.
function toQ(a, v) {
  if (a.kind === 'linear') return a.gain * (v * (MM[a.units] || 1) - a.offset);
  if (a.role === 'rotary') return a.units === 'RADIAN' ? THREE.MathUtils.radToDeg(v) : v;
  return v;
}
function applyJoint(a, q) {
  if (!a.node) return;
  if (a.kind === 'linear') a.node.position.copy(a.localDir).multiplyScalar(q);
  else a.node.quaternion.setFromAxisAngle(a.localAxis, THREE.MathUtils.degToRad(q));
}
// Travel envelope of each joint: probe limits/specifications first, widened by what the agent has reported
function computeEnv(a) {
  const has = isFinite(a.obsMin);
  if (a.role === 'spindle' || a.motionType === 'CONTINUOUS') return a.env = { lo: 0, hi: 360, full: true, src: 'continuous' };
  if (a.kind === 'linear') {
    if (a.limits) { const l = toQ(a, a.limits.min), h = toQ(a, a.limits.max); return a.env = { lo: Math.min(l, h, has ? a.obsMin : l), hi: Math.max(l, h, has ? a.obsMax : h), src: 'probe constraints' }; }
    const lo = has ? a.obsMin : 0, hi = has ? a.obsMax : 0;
    const L = Math.max((hi - lo) * 1.08 + 30, a.specLen || 0, 220), c = (lo + hi) / 2;
    return a.env = { lo: c - L / 2, hi: c + L / 2, src: a.specLen && L === a.specLen ? 'probe specification' : 'observed travel' };
  }
  let lo, hi, src;
  if (a.specAng || a.limits) { const s = a.specAng || a.limits; lo = Math.min(s.min, has ? a.obsMin - 3 : s.min); hi = Math.max(s.max, has ? a.obsMax + 3 : s.max); src = 'probe specification'; }
  else if (has) { lo = a.obsMin - 10; hi = a.obsMax + 10; src = 'observed travel'; }
  else { lo = -180; hi = 180; src = 'default'; }
  if (hi - lo >= 330) return a.env = { lo: 0, hi: 360, full: true, src };
  return a.env = { lo, hi, src };
}
const clampEnv = (a, v) => a.env.full ? v : Math.min(a.env.hi, Math.max(a.env.lo, v));
function sweepValues(a, fine) {
  if (a.role === 'spindle') return [0];
  if (a.kind === 'linear') return [a.env.lo, a.env.hi];
  const lo = a.env.full ? 0 : a.env.lo, hi = a.env.full ? 360 - (fine ? 30 : 120) : a.env.hi;
  const n = Math.max(2, Math.ceil((hi - lo) / (fine ? 30 : 60)) + 1);
  return Array.from({ length: n }, (_, i) => lo + (hi - lo) * i / (n - 1));
}
// Visit every combination of joint extremes (linear ends x rotary angle steps)
function forEachPose(joints, fine, fn) {
  const lists = joints.map(a => sweepValues(a, fine));
  const idx = lists.map(() => 0);
  for (;;) {
    joints.forEach((a, i) => applyJoint(a, lists[i][idx[i]]));
    fn();
    let i = 0;
    while (i < idx.length && ++idx[i] >= lists[i].length) { idx[i] = 0; i++; }
    if (i >= idx.length) break;
  }
}
function setMidPose(joints) { joints.forEach(a => applyJoint(a, a.kind === 'linear' ? (a.env.lo + a.env.hi) / 2 : a.role === 'rotary' ? clampEnv(a, 0) : 0)); }
function sweptBox(root, joints, filter) {
  const b = new THREE.Box3();
  forEachPose(joints, true, () => { root.updateMatrixWorld(true); b.union(boxOf(root, filter)); });

/* ---------- WORK SIDE, milling: pedestal -> slides -> trunnion / rotary table -> fixture + stock ---------- */

  const tilts = [];
  for (const a of chain) {
    const i = dom(a.S);

      parent = r.g; mount = r.mount;
    } else if (i === 1) {                            // rotary table (or a vertical work spindle)
      const g = new THREE.Group(); g.position.copy(mount); parent.add(g);

      for (const r of [0, 1, 2]) { const slot = box(380, 3, 14, M.dark); slot.rotation.y = r * Math.PI / 3; slot.position.y = 60; g.add(slot); }
      const mark = box(26, 36, 40, accent(a.k)); mark.position.set(0, 43, 190); g.add(mark);
      const tag = label(a.name, AXIS_HEX[a.k]); tag.position.set(0, 60, 290); g.add(tag);

      const drum = K('drum', [150, 210, 210], [i, 1, o]); holder.add(drum);

/* ---------- WORK SIDE, turning: (slide ->) headstock -> chuck (+ C axis) -> bar stock ---------- */

/* =====================================================================
   7. LIVE DATA

   All axes are then played back on ONE shared clock, slightly behind live, interpolating between

  const p = new URLSearchParams(q); if (usePath) p.set('path', '//Axes');

}
async function fetchStreams(kind, q) {
  const doc = await fetchXml(streamUrl(kind, q));

  return doc;
}

    catch { nextSeq = null; doc = await fetchStreams('current'); }       // fell out of the buffer -> resync

  } catch (e) { setStatus('Agent not reachable: ' + e.message + ' — is proxy.py running?', 'err'); }

async function pollLoop(gen) {

/* =====================================================================

    for (const a of axes) {
      if (!a.node || !a.samples.length) continue;
      if (a.role === 'spindle') { a.cur = sampleAt(a, Infinity); a.spin += (a.cur / 60) * 2 * Math.PI * dt * SPIN_SCALE; a.node.quaternion.setFromAxisAngle(a.localAxis, a.spin); continue; }
      a.cur = sampleAt(a, playT);
      if (!a.env.full && (a.cur < a.env.lo - 0.5 || a.cur > a.env.hi + 0.5)) outside = true;
      applyJoint(a, a.cur);
    }
    // An axis went further than the machine was built for: rebuild with the larger envelope (and re-prove the layout)
    if (outside && !rebuildAt) rebuildAt = now + 300;
    if (rebuildAt && now > rebuildAt && now - lastRebuild > 1500) { rebuildAt = 0; lastRebuild = now; buildMachine(); renderInfo(); }

    machineRoot.updateMatrixWorld(true);
    if (twin.trail.visible) {                                              // tool tip in workpiece coordinates
      twin.tool.tip.getWorldPosition(_tw); twin.trailFrame.worldToLocal(_tw);
      if (!twin.lastTip || twin.lastTip.distanceToSquared(_tw) > 1) {
        const pos = twin.trail.geometry.attributes.position;
        if (twin.trailN >= twin.trailMax) { pos.array.copyWithin(0, 3); twin.trailN--; }
        pos.setXYZ(twin.trailN++, _tw.x, _tw.y, _tw.z); pos.needsUpdate = true; twin.trail.geometry.setDrawRange(0, twin.trailN);
        (twin.lastTip ||= new V3()).copy(_tw);
      }
    }
    if (now - lastCheck > 250) {                                           // live interference check
      lastCheck = now;
      twin.contact = !!anyContact(twin.toolMeshes, twin.workMeshes);
      let gap = Infinity;
      for (const c of twin.cutterMeshes) { _b1.setFromObject(c); for (const w of twin.workMeshes) { _b2.setFromObject(w); gap = Math.min(gap, _b1.distanceToPoint(_b2.clampPoint(_b1.getCenter(_tw), _tw))); } }
      twin.gap = gap;
    }
    if (now - lastTable > 200) { lastTable = now; renderTable(); renderSafety(); }
  }
  controls.update();
  renderer.render(scene, camera);
}
frame();

/* =====================================================================
   9. UI
   ===================================================================== */
function setStatus(msg, cls = 'muted') { const s = $('status'); s.textContent = msg; s.className = cls; }
const unitLabel = a => ({ MILLIMETER: 'mm', INCH: 'in', DEGREE: '°', RADIAN: 'rad', 'REVOLUTION/MINUTE': 'rpm' }[a.units] || a.units.toLowerCase());
const hex = k => '#' + AXIS_HEX[k].toString(16).padStart(6, '0');
function renderTable() {
  $('axisTable').querySelector('tbody').innerHTML = axes.map(a => {
    const v = num(a.raw), val = a.raw === undefined ? '–' : v !== null ? v.toFixed(a.role === 'spindle' ? 0 : 3) + ' ' + unitLabel(a) : a.raw;
    const pct = (a.cur !== null && a.env && !a.env.full && a.role !== 'spindle') ? Math.min(100, Math.max(0, (a.cur - a.env.lo) / (a.env.hi - a.env.lo) * 100)) : null;
    const what = a.role === 'spindle' ? (a.side === 'tool' ? 'tool spindle' : 'work spindle') : a.kind === 'linear' ? 'linear' : 'rotary';
    const travel = a.role === 'spindle' ? '' : a.env?.full ? ' · full turn' : a.env ? ` · travel ${(a.env.hi - a.env.lo).toFixed(0)}${a.kind === 'linear' ? ' mm' : '°'} (${a.env.src})` : '';
    return `<tr><td><span class="swatch" style="background:${hex(a.k)}"></span><b>${a.name}</b>
      <div class="muted">${what} along machine ${a.u[a.k] < 0 ? '−' : ''}${a.letter} (${a.vecSource})${a.gain !== 1 && a.kind === 'linear' ? ' ×' + a.gain : ''} · moves the ${a.side === 'tool' ? 'tool' : 'work'}${a.parentAxis ? ' · on ' + a.parentAxis.name : ''}<br>
      ${a.itemId} · ${a.itemType}${a.csName ? ' · ' + a.csName + (a.csType ? ' [' + a.csType + ']' : '') : ''}${travel}</div>
      ${pct !== null ? `<div class="bar"><i style="left:calc(${pct}% - 1px)"></i></div>` : ''}</td>
      <td class="val">${val}${a.kind === 'linear' && a.cur !== null && (a.offset || a.gain !== 1) ? `<div class="muted">${a.cur.toFixed(1)} mm from base</div>` : ''}</td></tr>`;
  }).join('') || '<tr><td class="muted">No axes found in the probe</td></tr>';
}
function renderSafety() {
  if (!twin) return;
  $('safety').innerHTML = `<span>Layout proof</span><span class="${twin.layoutOK ? 'ok' : 'err'}">${twin.layoutOK ? 'no contact anywhere in the travel sweep' : 'could not clear all extremes'}</span>
    <span>Live check</span><span class="${twin.contact ? 'err' : 'ok'}">${twin.contact ? 'CONTACT between tool side and work side' : 'clear'}</span>
    <span>Tool to work</span><span>${twin.gap === null || !isFinite(twin.gap) ? '–' : twin.gap.toFixed(0) + ' mm'}</span>`;
}
function renderInfo(deviceEl) {
  const n = r => axes.filter(a => a.role === r).length;
  const tr = axes.filter(a => a.role === 'rotary' && a.side === 'tool').length, pr = axes.filter(a => a.role === 'rotary' && a.side === 'part').length;
  const cfg = (tr + pr === 0 ? 'no rotary axes' : tr && pr ? 'head / table (rotary on both sides)' : tr ? 'head / head (rotaries on the spindle head)' : 'table / table (rotaries under the work)');
  $('deviceInfo').innerHTML = `<span>Device</span><span>${deviceName}</span>
    <span>Axes</span><span>${n('linear')} linear, ${n('rotary')} rotary, ${n('spindle')} spindle</span>
    <span>Type</span><span>${sides.turning ? 'turning / mill-turn (work held in a spindle)' : 'machining centre'}</span>
    <span>Rotary layout</span><span>${cfg}</span>
    <span>Chain</span><span>${sides.tool.map(a => a.name).join(' → ') || '–'} <span class="muted">(tool)</span><br>${sides.partGroups.map(g => g.map(a => a.name).join(' → ')).join('<br>') || '–'} <span class="muted">(work)</span></span>
    <span>Layout from</span><span>${sides.mode}</span>`;
  renderTable(); renderSafety();
}
function describeCoords(deviceEl) {
  const cs = Object.values(coordSystems(deviceEl));
  const used = [...new Set(axes.map(a => a.csName).filter(Boolean))];
  return (cs.length ? cs.map(c => `${c.id} [${c.type}]${c.parent ? ' in ' + c.parent : ''}${c.t.some(v => v) ? ' @ ' + c.t.join(', ') : ''}`).join('<br>') : 'None declared: positions taken as machine coordinates')
    + (used.length ? `<br>Twin positions use: ${used.join(', ')}` : '');
}

let probeDoc = null;
async function connect(reloadProbe) {
  running = false; pollGen++; nextSeq = null; latencies.length = 0; clockOffset = null; usePath = true; gaps.length = 0; playDelay = PLAYBACK_DELAY;
  try {
    const base = $('agentUrl').value.replace(/\/+$/, '');
    if (reloadProbe || !probeDoc || base !== agentBase) {
      agentBase = base; setStatus('Reading probe…');
      probeDoc = await fetchXml(`${agentBase}/probe`);
      const devices = byTag(probeDoc, 'Device'), sel = $('deviceSel');
      sel.innerHTML = devices.map(d => `<option>${d.getAttribute('name')}</option>`).join('');
      const wanted = params.get('device'); if (wanted && devices.some(d => d.getAttribute('name') === wanted)) sel.value = wanted;
    }
    deviceName = $('deviceSel').value;
    const deviceEl = byTag(probeDoc, 'Device').find(d => d.getAttribute('name') === deviceName);
    if (!deviceEl) throw new Error('device not in probe');
    axes = discover(deviceEl); sides = assignSides(axes);
    setStatus('Learning axis travel from the agent buffer…');
    await learnEnvelope();
    firstView = true; buildMachine();
    $('coordInfo').innerHTML = describeCoords(deviceEl); renderInfo(deviceEl);
    const u = new URL(location); u.searchParams.set('device', deviceName); history.replaceState(null, '', u);
    running = true; pollLoop(pollGen);
  } catch (e) { setStatus('Error: ' + e.message + ' — is proxy.py running?', 'err'); console.error(e); }
}
$('connectBtn').onclick = () => connect(true);
$('deviceSel').onchange = () => connect(false);
$('viewBtn').onclick = resetView;
$('trailBtn').onclick = () => { showTrail = !showTrail; $('trailBtn').textContent = 'Tool path: ' + (showTrail ? 'on' : 'off'); if (twin) { twin.trail.visible = showTrail; twin.trailN = 0; twin.trail.geometry.setDrawRange(0, 0); } };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// For debugging / testing from the console
window.twin = { get axes() { return axes; }, get state() { return twin; }, get root() { return machineRoot; }, get sides() { return sides; }, THREE,
  stop() { running = false; pollGen++; }, applyJoint, forEachPose, anyContact, meshesOf };
connect(true);
</script>
