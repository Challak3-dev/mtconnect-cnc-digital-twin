<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTConnect CNC Digital Twin (simple)</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #d9dee4; overflow: hidden; }
  #panel { position: fixed; top: 10px; left: 10px; width: 330px; max-height: 95vh; overflow: auto; background: #fff;
           border: 1px solid #c3cad3; border-radius: 8px; padding: 12px; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 8px; } h2 { font-size: 11px; margin: 12px 0 4px; color: #667; text-transform: uppercase; }
  select { width: 100%; padding: 5px; } table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 2px; border-bottom: 1px solid #e3e7ec; vertical-align: top; }
  .val { text-align: right; font-family: monospace; white-space: nowrap; } .muted { color: #667; font-size: 11px; }
  .ok { color: #1a7f37; } .err { color: #c62828; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="panel">
  <h1>CNC Digital Twin (simple version)</h1>
  <select id="device"></select>
  <div id="status" class="muted">Connecting…</div>
  <h2>Machine</h2><div id="info" class="muted"></div>
  <h2>Axes discovered from the probe</h2><table id="axes"></table>
  <h2>Coordinate systems</h2><div id="cs" class="muted"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 1. Settings. No device name, data item id or axis list appears anywhere in this file. ----------
const params = new URLSearchParams(location.search);
const AGENT = params.get('agent') || `${location.origin}/agent`;   // proxy.py forwards /agent to the MTConnect agent
const POLL_MS = 400, DELAY_MS = 1200;                              // show the machine 1.2 s behind, to interpolate
const $ = id => document.getElementById(id);

// ---------- 2. MTConnect helpers ----------
async function getXml(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  return new DOMParser().parseFromString(await res.text(), 'application/xml');
}
const all = (node, tag) => [...node.getElementsByTagNameNS('*', tag)];
const numbers = text => (text || '').trim().split(/\s+/).map(Number);

// ---------- 3. Discovery: read the probe and list every axis ----------
const LETTER = { X: [1,0,0], U: [1,0,0], Y: [0,1,0], V: [0,1,0], Z: [0,0,1], W: [0,0,1], A: [1,0,0], B: [0,1,0], C: [0,0,1] };

function discover(device) {
  // Coordinate systems: id -> type and offset from the base (following parentIdRef)
  const cs = {};
  for (const c of all(device, 'CoordinateSystem'))
    cs[c.getAttribute('id')] = { type: c.getAttribute('type'), parent: c.getAttribute('parentIdRef'), t: numbers(all(c, 'Translation')[0]?.textContent) };
  const offsetOf = id => { const t = [0,0,0]; while (cs[id]) { cs[id].t.forEach((v, i) => t[i] += v || 0); id = cs[id].parent; } return t; };

  const axes = [];
  for (const comp of [...all(device, 'Linear'), ...all(device, 'Rotary')]) {
    const linear = comp.localName === 'Linear';
    const items = [...comp.children].filter(c => c.localName === 'DataItems').flatMap(d => [...d.children]);
    // Position item: POSITION (linear) or ANGLE (rotary), preferring ACTUAL in MACHINE coordinates
    const score = d => (d.getAttribute('subType') === 'ACTUAL' ? 2 : 0) + (cs[d.getAttribute('coordinateSystemIdRef')]?.type === 'MACHINE' || d.getAttribute('coordinateSystem') === 'MACHINE' ? 1 : 0);
    const best = type => items.filter(d => d.getAttribute('type') === type && d.getAttribute('category') === 'SAMPLE').sort((a, b) => score(b) - score(a))[0];
    const position = best(linear ? 'POSITION' : 'ANGLE'), speed = best('ROTARY_VELOCITY');
    const item = position || speed;
    if (!item) continue;
    const name = comp.getAttribute('name') || comp.getAttribute('id');
    const motion = all(comp, 'Motion')[0];
    const rel = type => all(comp, 'ComponentRelationship').find(r => r.getAttribute('type') === type)?.getAttribute('idRef');
    // Direction: the probe's axis vector if it has one, otherwise the ISO axis letter
    let vec = numbers(motion && all(motion, 'Axis')[0]?.textContent);
    if (vec.length !== 3 || vec.some(isNaN)) vec = LETTER[name[0].toUpperCase()] || [0,0,1];
    const k = vec.map(Math.abs).indexOf(Math.max(...vec.map(Math.abs)));          // 0 = X, 1 = Y, 2 = Z
    const csId = motion?.getAttribute('coordinateSystemIdRef') || item.getAttribute('coordinateSystemIdRef');
    const length = all(comp, 'Specification').find(s => s.getAttribute('type') === 'LENGTH');
    axes.push({
      name, role: linear ? 'linear' : position ? 'rotary' : 'spindle', k, sign: Math.sign(vec[k]),
      gain: linear ? Math.hypot(...vec) : 1,                     // e.g. 0.5 when a lathe X axis reports diameter
      offset: linear && csId ? offsetOf(csId)[k] : 0,            // where its coordinate system sits from the base
      itemId: item.getAttribute('id'), itemType: item.getAttribute('type'), units: item.getAttribute('units'), csId,
      travel: Number(all(length || comp, 'Nominal')[0]?.textContent) || 600,       // mm, from the probe if given
      motionId: motion?.getAttribute('id'), parentMotion: motion?.getAttribute('parentIdRef'), relParent: rel('PARENT'), relChild: rel('CHILD'),
      id: comp.getAttribute('id'), samples: [], value: null, raw: '-',
    });
  }
  // Kinematic parent of each axis (Motion parentIdRef, or ComponentRelationship PARENT)
  for (const a of axes)
    a.parent = axes.find(b => b !== a && ((a.parentMotion && b.motionId === a.parentMotion) || (a.relParent && (b.relChild === a.relParent || b.id === a.relParent)))) || null;
  // Tool side vs work side: axes linked by parents form chains. The chain with the most linear axes carries the tool.
  const root = a => { while (a.parent) a = a.parent; return a; };
  if (axes.some(a => a.parent)) {
    const count = r => axes.filter(a => root(a) === r && a.role === 'linear').length;
    const toolRoot = axes.map(root).sort((p, q) => count(q) - count(p))[0];
    for (const a of axes) a.side = root(a) === toolRoot ? 'tool' : 'work';
    const toolHasSpindle = axes.some(a => a.side === 'tool' && a.role === 'spindle');
    for (const a of axes) if (a.role === 'spindle' && !a.parent && a.side === 'work' && !toolHasSpindle && !a.motionId) a.side = 'tool';
  } else {                                                       // no kinematics in the probe: classic vertical mill
    for (const a of axes) a.side = (a.role === 'spindle' || (a.role === 'linear' && a.k === 2)) ? 'tool' : 'work';
  }
  return { axes, cs };
}

// ---------- 4. 3D scene ----------
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9dee4);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 10, 30000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8894a3, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1500, 3000, 2000); scene.add(sun);
scene.add(new THREE.GridHelper(8000, 40, 0xaab3bf, 0xbcc4ce));
const COLOR = [0xd64545, 0x2e9e4f, 0x2f6fd6];                    // machine X, Y, Z
const box = (x, y, z, color) => new THREE.Mesh(new THREE.BoxGeometry(x, y, z), new THREE.MeshStandardMaterial({ color }));
const drum = (r, h, color) => new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 32), new THREE.MeshStandardMaterial({ color }));
// Machine axis -> scene direction (scene Y is up; machine Z is the spindle axis, so it points up)
const DIR = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 1, 0)];
const REACH = [380, 200, 200];                                   // how far each direction moves on screen (+/-)
const SWING = 300, TOOL = 250;                                   // room a tilting table / tilting head needs

// Build the machine from the axis list. Every stage is a Group nested in its parent, so moving one carries the rest.
let machine = null;
function build(axes) {
  if (machine) scene.remove(machine);
  machine = new THREE.Group(); scene.add(machine);
  const base = box(1700, 160, 1700, 0x56616f); base.position.set(0, 80, -200); machine.add(base);
  const by = (side, role) => axes.filter(a => a.side === side && a.role === role);

  // --- Work side: slides, then tilting cradle(s), then rotary table(s), then the part ---
  let parent = machine, top = 160;                               // "top" = height of the highest point so far
  const stack = (group, y) => { group.position.y = y; parent.add(group); parent = group; };
  for (const a of by('work', 'linear')) {
    const g = new THREE.Group(); stack(g, parent === machine ? 160 : 60);
    const slab = box(a.k === 0 ? 900 : 600, 60, a.k === 0 ? 420 : 500, COLOR[a.k]); slab.position.y = 30; g.add(slab);
    a.node = g; a.home = g.position.clone(); top += 60 + (a.k === 2 ? REACH[2] : 0);
  }
  let seat = parent === machine ? 160 : 60;
  const rotaries = by('work', 'rotary').sort((p, q) => (p.k === 2) - (q.k === 2));   // tilts first, table on top
  for (const a of rotaries) {
    const g = new THREE.Group();
    if (a.k === 2) {                                             // rotary table
      stack(g, seat); const plate = drum(190, 50, 0xd0a040); plate.position.y = 25; g.add(plate);
      const mark = box(24, 52, 160, 0x222222); mark.position.set(0, 26, 100); g.add(mark);
      seat = 50; top += 50;
    } else {                                                     // trunnion: pivot high enough to swing all the way round
      for (const s of [-1, 1]) { const post = box(60, SWING + 40, 120, 0x56616f); post.position.set(a.k === 0 ? s * 300 : 0, seat + (SWING + 40) / 2, a.k === 0 ? 0 : s * 300); parent.add(post); }
      stack(g, seat + SWING);
      const cradle = box(a.k === 0 ? 520 : 300, 40, a.k === 0 ? 300 : 520, 0x8e7cc3); cradle.position.y = -20; g.add(cradle);
      seat = 0; top += 2 * SWING;
    }
    a.node = g;
  }
  const part = box(140, 100, 140, 0xc9ced6); part.position.y = seat + 50; parent.add(part); top += 100;

  // --- Tool side: X/Y move the whole column, Z moves the head, rotaries tilt the spindle, the spindle turns the tool ---
  parent = machine;
  for (const a of by('tool', 'linear').filter(a => a.k !== 2)) {
    const g = new THREE.Group(); stack(g, parent === machine ? 160 : 30);
    const saddle = box(700, 30, 420, COLOR[a.k]); saddle.position.set(0, 15, -820); g.add(saddle);
    a.node = g; a.home = g.position.clone();
  }
  const zAxes = by('tool', 'linear').filter(a => a.k === 2), tilts = by('tool', 'rotary');
  const headY = top + 40 + TOOL + tilts.length * (SWING + 20) + zAxes.length * REACH[2];   // lowest tool point clears the work
  const column = box(520, headY + 500, 320, 0x3c4550); column.position.set(0, (headY + 500) / 2, -820); parent.add(column);
  for (const a of zAxes) { const g = new THREE.Group(); parent.add(g); parent = g; a.node = g; a.home = g.position.clone(); }
  const head = box(260, 400, 790, 0x2f6fd6); head.position.set(0, headY + 200, -265); parent.add(head);
  let hang = new THREE.Group(); hang.position.set(0, headY, 0); parent.add(hang);
  for (const a of tilts) {                                       // tilting / swivelling spindle housing
    const pivot = new THREE.Group(); pivot.position.y = -(SWING + 20); hang.add(pivot);
    const link = box(60, SWING + 20, 60, 0x56616f); link.position.set(a.k === 0 ? 130 : 0, -(SWING + 20) / 2, a.k === 0 ? 0 : 130); hang.add(link);
    pivot.add(box(170, 170, 170, 0x8e7cc3)); a.node = pivot; hang = pivot;
  }
  const spindle = new THREE.Group(); hang.add(spindle);
  const nose = drum(70, 60, 0x777777); nose.position.y = -30 - (tilts.length ? 85 : 0); spindle.add(nose);
  const cutter = drum(16, 150, 0xe9c46a); cutter.position.y = nose.position.y - 105; spindle.add(cutter);
  for (const a of by('tool', 'spindle')) a.node = spindle;

  controls.target.set(0, headY * 0.6, -250); camera.position.set(headY * 1.9, headY * 1.3, headY * 2.6); controls.update();
}

// ---------- 5. Live data: /sample returns every observation since the last request, with timestamps ----------
let axes = [], deviceName = '', nextSeq = null, clockOffset = null, run = 0;

function readStreams(doc) {
  const now = Date.now();
  for (const el of all(doc, '*')) {
    const a = axes.find(a => a.itemId === el.getAttribute('dataItemId'));
    if (!a) continue;
    a.raw = el.textContent.trim();
    let v = parseFloat(a.raw);
    if (isNaN(v)) continue;                                      // UNAVAILABLE
    if (a.role === 'linear') v = a.gain * (v * (a.units === 'INCH' ? 25.4 : 1) - a.offset);   // real mm from the base
    if (a.units === 'RADIAN') v *= 180 / Math.PI;
    const t = Date.parse(el.getAttribute('timestamp')) || now, last = a.samples.at(-1);
    if (last && t <= last.t) continue;
    if (a.role === 'rotary' && last) v += 360 * Math.round((last.v - v) / 360);    // 359 -> 1 is +2 degrees
    if (last && t - last.t > 5000) a.samples.push({ t: t - 1000, v: last.v });       // long silence: it was standing still
    a.samples.push({ t, v });
    if (a.samples.length > 400) a.samples.shift();
    clockOffset = Math.min(clockOffset ?? Infinity, now - t);    // difference between my clock and the agent's
  }
  nextSeq = all(doc, 'Header')[0]?.getAttribute('nextSequence') ?? nextSeq;
}
async function poll(id) {
  while (id === run) {
    try {
      const url = `${AGENT}/${encodeURIComponent(deviceName)}/` + (nextSeq ? `sample?from=${nextSeq}&count=2000` : 'current');
      readStreams(await getXml(url).catch(() => { nextSeq = null; return getXml(`${AGENT}/${encodeURIComponent(deviceName)}/current`); }));
      $('status').textContent = 'Live · ' + new Date().toLocaleTimeString(); $('status').className = 'ok';
    } catch (e) { $('status').textContent = 'Agent not reachable: ' + e.message; $('status').className = 'err'; }
    showAxes();
    await new Promise(r => setTimeout(r, POLL_MS));
  }
}
// Value of an axis at time t, interpolated between the two real samples around it
function valueAt(a, t) {
  const s = a.samples;
  if (!s.length) return null;
  if (s.length < 2 || t >= s.at(-1).t) return s.at(-1).v;
  let i = s.length - 2; while (i > 0 && s[i].t > t) i--;
  return t <= s[i].t ? s[i].v : s[i].v + (s[i + 1].v - s[i].v) * (t - s[i].t) / (s[i + 1].t - s[i].t);
}

// ---------- 6. Apply the values to the model, every frame, all axes at the same instant ----------
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta(), t = Date.now() - (clockOffset ?? 0) - DELAY_MS;
  for (const a of axes) {
    const v = valueAt(a, a.role === 'spindle' ? Infinity : t);
    if (v === null || !a.node) continue;
    a.value = v;
    if (a.role === 'linear') {
      // Real millimetres around the middle of the range seen so far, scaled to fit the model's reach
      a.min = Math.min(a.min ?? v, v); a.max = Math.max(a.max ?? v, v);
      const mid = (a.min + a.max) / 2, scale = Math.min(1, REACH[a.k] / Math.max(a.travel / 2, (a.max - a.min) / 2));
      a.centre = a.centre === undefined ? mid : a.centre + (mid - a.centre) * Math.min(1, dt);
      const shown = THREE.MathUtils.clamp((v - a.centre) * scale, -REACH[a.k], REACH[a.k]);
      a.node.position.copy(a.home).addScaledVector(DIR[a.k], shown * a.sign);
    } else if (a.role === 'rotary') {
      a.node.setRotationFromAxisAngle(DIR[a.k], THREE.MathUtils.degToRad(v) * a.sign);
    } else {
      a.node.rotation.y += v / 60 * 2 * Math.PI * dt * 0.02;     // spindle, slowed down so it is visible
    }
  }
  controls.update(); renderer.render(scene, camera);
}
frame();

// ---------- 7. Panel ----------
function showAxes() {
  $('axes').innerHTML = axes.map(a => `<tr><td><b style="color:#${COLOR[a.k].toString(16)}">${a.name}</b>
    <div class="muted">${a.role} on machine ${'XYZ'[a.k]} · moves the ${a.side}${a.parent ? ' · on ' + a.parent.name : ''}<br>${a.itemId} · ${a.itemType} · ${a.units} · ${a.csId || 'no coordinate system'}</div></td>
    <td class="val">${a.raw}</td></tr>`).join('');
}
let probe = null;
async function connect() {
  run++; nextSeq = null; clockOffset = null;
  try {
    probe ||= await getXml(`${AGENT}/probe`);
    const devices = all(probe, 'Device');
    if (!$('device').options.length) {
      $('device').innerHTML = devices.map(d => `<option>${d.getAttribute('name')}</option>`).join('');
      if (devices.some(d => d.getAttribute('name') === params.get('device'))) $('device').value = params.get('device');
    }
    deviceName = $('device').value;
    const found = discover(devices.find(d => d.getAttribute('name') === deviceName));
    axes = found.axes; build(axes);
    const n = role => axes.filter(a => a.role === role).length;
    $('info').innerHTML = `${n('linear')} linear, ${n('rotary')} rotary, ${n('spindle')} spindle axes<br>tool side: ${axes.filter(a => a.side === 'tool').map(a => a.name).join(', ')}<br>work side: ${axes.filter(a => a.side === 'work').map(a => a.name).join(', ')}`;
    $('cs').innerHTML = Object.entries(found.cs).map(([id, c]) => `${id} [${c.type}] at ${c.t.join(', ') || '0 0 0'}`).join('<br>') || 'none declared';
    showAxes(); poll(run);
  } catch (e) { $('status').textContent = 'Error: ' + e.message + ' (is proxy.py running?)'; $('status').className = 'err'; }
}
$('device').onchange = connect;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.twin = { get axes() { return axes; }, get machine() { return machine; }, THREE };
connect();
</script>
</body>
</html>
